[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyquantumkit-run"
version = "0.0.1"
description = "A cross-platform executor for quantum circuits and programs written by PyQuantumKit, supporting mainstream quantum cloud platforms."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Wei Sun", email = "sunwei@ihep.ac.cn"},
    {name = "Peixun Long", email = "longpx@ihep.ac.cn"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
keywords = ["quantum cloud"]
dependencies = [
    "pyquantumkit>=0.2.1",
]
requires-python = ">=3.8"

[tool.setuptools]
license-files = []

[project.optional-dependencies]
qiskit = ["qiskit","qiskit-aer"]
pyqpanda3 = ["pyqpanda3"]
quafu = ["pyquafu"]
quafu-sdk = ["quafu-sdk"]
cqlib = ["cqlib"]
iqm = ["iqm-client[qiskit]"]
openquantum = ["openquantum-sdk"]
wuyue = ["wuyue", "qiskit"]

[project.urls]
Homepage = "https://pyquantumkit.readthedocs.io/"
Repository = "https://github.com/hiquarc/pyquantumkit-run"
Documentation = "https://pyquantumkit.readthedocs.io/"

[tool.setuptools.packages.find]
include = ["pqk_run*"]

[tool.setuptools.package-data]
"pyquantumkit" = ["init_frame.txt"]
